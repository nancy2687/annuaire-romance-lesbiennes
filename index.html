<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Annuaire romance lesbiennes - Accueil </title>
<style>

/* ===== VARIABLES ===== */
:root {
    --primary-color: #70243B;
    --secondary-color: #D8AAB7;
    --accent-color: #FFF9F5;
    --text-color: #70243B;
    --light-bg: #F8E8EC;
    --shadow: 0 4px 12px rgba(112, 36, 59, 0.12);
    --border-radius: 14px;
    --transition: all 0.3s ease;
}

/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ===== PAGE ===== */
body {
    min-height: 100vh;
    background-color: var(--light-bg);
    color: var(--text-color);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.6;
}

/* ===== CONTENU PRINCIPAL ===== */
main {
    width: min(90%, 850px);
    margin: 0 auto;
    padding: 4rem 1rem;
    text-align: center;
}

/* ===== TITRE ===== */
h1 {
    color: var(--primary-color);
    font-family: Georgia, serif;
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    line-height: 1.3;
    margin-bottom: 1.5rem;
}

/* ===== DESCRIPTION ===== */
p {
    margin-bottom: 1.5rem;
    color: var(--text-color);
}

/* ===== BOUTON ===== */
.btn {
    display: inline-block;
    padding: 0.9rem 1.8rem;
    margin: 1rem 0;
    background-color: var(--primary-color);
    color: var(--accent-color);
    font-weight: bold;
    text-decoration: none;
    border: 2px solid var(--primary-color);
    border-radius: var(--border-radius);
    transition: var(--transition);
}

.btn:hover {
    background-color: var(--secondary-color);
    color: var(--primary-color);
}

.btn:focus-visible {
    outline: 3px solid var(--primary-color);
    outline-offset: 4px;
}

/* ===== ASTUCE ===== */
.info {
    max-width: 600px;
    margin: 2rem auto 0;
    padding: 1rem;
    background-color: var(--accent-color);
    border-left: 5px solid var(--secondary-color);
    border-radius: 8px;
    box-shadow: var(--shadow);
    text-align: left;
}

/* ===== PETITS ÉCRANS ===== */
@media (max-width: 480px) {
    main {
        padding: 2.5rem 0.5rem;
    }

    h1 {
        font-size: 1.7rem;
    }

    .btn {
        width: 100%;
        max-width: 300px;
    }
}

</style>
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4a90e2">
</head>

<body>

  <h1>Bienvenue sur l'application Annuaire des romances lesbiennes Françaises</h1>

  <p>Retrouve les romances lesbiennes françaises facilement  📚</p>

  <a class="btn" href="annuaire-romance-lesbiennes-v2.html">
    Accéder à l'application
  </a>

  <p class="info">
    💡 Astuce : ajoute cette application à ton écran d’accueil pour l’utiliser hors ligne.
  </p>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((registration) => {
            console.log("Service Worker enregistré :", registration.scope);
          })
          .catch((error) => {
            console.error("Erreur Service Worker :", error);
          });
      });
    }
  </script>

</body>
</html>
